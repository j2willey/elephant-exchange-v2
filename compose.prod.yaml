# On the droplet, Caddy fronts the app over HTTPS and the app itself is reachable only by Caddy:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Settings come from .env (copy .env.example).
services:
  app:
    ports: !reset []
    expose:
      - "3000"
    environment:
      BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
      TRUST_PROXY: "1"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep, or Let's Encrypt's rate limits bite on rebuilds
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
