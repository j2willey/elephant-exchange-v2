# On the droplet the app sits behind ww-edge, the droplet's front door (a separate repo: one Caddy on 80/443 that
# routes by hostname to containers on the shared `edge` network). The app publishes no port; ww-edge reaches it as
# elephant-exchange:3000, and its site file (caddy/sites/elephant-exchange.caddy there) holds the HTTPS headers.
# Settings come from .env (copy .env.example; its COMPOSE_FILE line adds this file, so plain `docker compose` works):
#   docker compose up -d   (scripts/deploy.sh does this, after shipping the image)
# The image is built on Omarchy and shipped by scripts/deploy.sh, never built here; TAG (in .env) is its commit.
services:
  app:
    build: !reset null
    image: elephant-exchange:${TAG:-latest}
    container_name: elephant-exchange
    ports: !reset []
    expose:
      - "3000"
    environment:
      BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
      # ww-edge's Caddy sets X-Forwarded-For to the address it saw.
      TRUST_PROXY: "1"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SIGNIN_LINKS_PER_DAY: ${SIGNIN_LINKS_PER_DAY:-100}
    # The droplet is shared with other apps (2 GB in all).
    mem_limit: 384m
    networks: [edge]

networks:
  edge:
    external: true
    # Overridable only so a test can run it against a throwaway network.
    name: ${EDGE_NETWORK:-edge}
